services:
  gemini-web2api:
    build: .
    container_name: gemini-web2api
    ports:
      - "8081:8081"
    environment:
      GEMINI_WEB2API_DATA_DIR: /data
      PORT: 8081
    volumes:
      # Optional source deployment: persist config, Cookie, stats, logs, uploads.
      - ./data:/data
    restart: unless-stopped
