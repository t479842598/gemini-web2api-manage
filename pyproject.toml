[project]
name = "gemini-web2api-manage"
version = "2.0.0"
description = "Web management console for gemini-web2api (upstream: Sophomoresty/gemini-web2api)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.25",
]

[project.scripts]
gemini-web2api-manage = "gemini_web2api_manage.__main__:main"

[tool.setuptools.packages.find]
include = ["gemini_web2api_manage*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
